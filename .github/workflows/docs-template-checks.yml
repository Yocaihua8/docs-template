name: Docs Template Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  docs-template-checks:
    name: Run docs template checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run PowerShell checks
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/test-docs-template-checks.ps1
